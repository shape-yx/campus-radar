<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Python 学习资源">
  <title>Python 学习资源</title>
  <!--
    自制图标：用 Python 标志性的蓝/黄两色画"两条交叠的带子"，
    呼应官方标志的构成，但不复制官方图形（避免商标问题）。
    纯几何路径，无外部依赖，缩放不失真。
  -->
  <defs>
    <clipPath id="eyeA"><circle cx="92" cy="52" r="9"/></clipPath>
    <clipPath id="eyeB"><circle cx="148" cy="188" r="9"/></clipPath>
  </defs>

  <!-- 上带：蓝。从左上角起，向下包住左半，再向右上收回 -->
  <path fill="#3776AB" d="
    M120 16
    C72 16 44 38 44 76
    L44 108
    C44 140 66 160 100 160
    L140 160
    L140 176
    L96 176
    C60 176 32 158 32 122
    L32 74
    C32 28 70 0 120 0
    C168 0 196 22 200 62
    L184 62
    C180 32 158 16 120 16
    Z"/>

  <!-- 下带：黄。与上带上下呼应、方向相反 -->
  <path fill="#FFD43B" d="
    M120 224
    C168 224 196 202 196 164
    L196 132
    C196 100 174 80 140 80
    L100 80
    L100 64
    L144 64
    C180 64 208 82 208 118
    L208 166
    C208 212 170 240 120 240
    C72 240 44 218 40 178
    L56 178
    C60 208 82 224 120 224
    Z"/>

  <!-- 两个"眼睛"：上带蓝、下带黄，取反色 -->
  <circle cx="92" cy="52" r="11" fill="#3776AB"/>
  <circle cx="92" cy="52" r="5" fill="#FFFFFF"/>
  <circle cx="148" cy="188" r="11" fill="#FFD43B"/>
  <circle cx="148" cy="188" r="5" fill="#1C1C1C"/>
</svg>
