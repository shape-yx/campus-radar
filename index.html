<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园雷达 · 机会画布</title>
<meta name="description" content="26 条校园机会摊在一个画布上：先散开看见全貌与紧急度，再按排布方式吸附归位。每条都标注材料原文给出的时间、地点、名额与报名截止，材料没写的一律显示「未注明」。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/canvas.css">
</head>
<body>

<header class="bar">
  <a class="bar__brand" href="#" data-act="reset">
    <img class="bar__logo" src="assets/img/zcst-logo.png"
         srcset="assets/img/zcst-logo.png 1x, assets/img/zcst-logo@2x.png 2x"
         width="109" height="36" alt="珠海科技学院">
    <span class="bar__name">校园雷达</span>
  </a>

  <nav class="bar__modes" id="modes" aria-label="排布方式">
    <button type="button" data-mode="globe" class="mode is-on"><i>01</i>所有项目</button>
    <button type="button" data-mode="scatter" class="mode"><i>02</i>散落</button>
    <button type="button" data-mode="grid" class="mode"><i>03</i>网格</button>
    <button type="button" data-mode="timeline" class="mode"><i>04</i>时间轴</button>
    <button type="button" data-act="mine" class="mode"><i>05</i>我的</button>
  </nav>

  <div class="bar__right">
    <span class="bar__count" id="count">—</span>
    <button class="bar__icon" id="themeBtn" type="button" title="切换主题（橄榄 / 深橄榄）">L</button>
  </div>
</header>

<div class="strip" id="strip"></div>

<main class="stage" id="stage" tabindex="-1">
  <div class="canvas" id="canvas" aria-live="polite"></div>
  <noscript><p class="empty">这个界面需要启用 JavaScript。</p></noscript>
</main>

<aside class="panel" id="panel" hidden aria-label="侧栏"></aside>
<div class="scrim" id="scrim" hidden></div>

<footer class="foot">
  <div class="foot__giant" aria-hidden="true"><span>校园</span><span>雷达</span></div>
  <div class="foot__meta">
    <span id="footText">校园雷达</span>
    <span id="footHint">拖动可转动球面 · 滚轮缩放 · 点卡片看详情</span>
    <span id="buildTag">构建 —</span>
  </div>
</footer>

<!-- 右侧缩放条：拖动改变画布比例（桌面端） -->
<div class="zoombar" id="zoombar" aria-label="画布缩放">
  <button class="zoombar__btn" type="button" data-zoom="in" title="放大（+）">+</button>
  <div class="zoombar__track" id="zoomTrack" role="slider"
       aria-label="画布缩放比例" aria-valuemin="50" aria-valuemax="200" aria-valuenow="100" tabindex="0">
    <div class="zoombar__rail"></div>
    <div class="zoombar__fill" id="zoomFill"></div>
    <div class="zoombar__knob" id="zoomKnob"></div>
    <span class="zoombar__tick" style="bottom:0%">50</span>
    <span class="zoombar__tick" style="bottom:25%">100</span>
    <span class="zoombar__tick" style="bottom:50%">150</span>
    <span class="zoombar__tick" style="bottom:75%">200</span>
  </div>
  <button class="zoombar__btn" type="button" data-zoom="out" title="缩小（−）">−</button>
  <button class="zoombar__btn zoombar__btn--val" type="button" data-zoom="reset" id="zoomVal" title="点击恢复 100%">100%</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/logic.js"></script>
<script src="assets/store.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
